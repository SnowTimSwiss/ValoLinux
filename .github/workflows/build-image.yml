# Runs when a GitHub release is published, or manually (Actions -> release -> Run workflow).
# Manual runs build and test but publish nothing: the ISO and agent are workflow artifacts.
#   1. test:         cargo test for server, agent and shared crate
#   2. iso:          live ISO (incl. valo-agent) -> attached to the release
#   3. server-image: Docker image -> ghcr.io/<owner>/valolinux-server:<tag> and :latest
#   4. agent:        valo-agent binary -> attached to the release
# DRAFT: the ISO and container jobs have not run on GitHub yet.
name: release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      fast:
        description: "Fast test build (zstd squashfs: much quicker, ISO bigger)"
        type: boolean
        default: true
      skip_tests:
        description: "Skip cargo test"
        type: boolean
        default: false
permissions:
  contents: write
env:
  # release tag, or dev-<run number> for manual runs
  TAG: ${{ github.event.release.tag_name || format('dev-{0}', github.run_number) }}
jobs:
  test:
    if: ${{ !inputs.skip_tests }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: cargo test
        run: cargo test --workspace --locked

  iso:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    container:
      image: debian:trixie
      options: --privileged
    env:
      GH_TOKEN: ${{ github.token }}
      VALO_FAST: ${{ inputs.fast && '1' || '' }}
    steps:
      - name: Install tools
        run: |
          # enable contrib/non-free-firmware so the package preflight sees firmware packages
          sed -i "s/^Components: main$/Components: main contrib non-free-firmware/" /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates gh live-build debootstrap \
            squashfs-tools xorriso grub-pc-bin grub-efi-amd64-bin mtools dosfstools syslinux syslinux-common \
            isolinux curl build-essential pkg-config sudo
          # Rust: valo-agent (and the FlameWM source fallback)
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      # live-build keeps downloaded packages in image/cache: reuse them between runs
      - uses: actions/cache@v4
        with:
          path: image/cache
          key: lb-cache-${{ hashFiles('image/config/package-lists/**') }}
          restore-keys: lb-cache-
      - name: Build ISO
        run: |
          . "$HOME/.cargo/env"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./image/build.sh "$GITHUB_WORKSPACE/out"
      - name: Name and checksum
        run: |
          cd out
          mv valolinux*.iso "valolinux-$TAG-amd64.iso"
          sha256sum valolinux-*.iso > SHA256SUMS
          ls -lh valolinux-*.iso
          echo "ISO size: $(du -h valolinux-*.iso | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: valolinux-iso
          path: out/*
      - name: Attach to release
        if: ${{ github.event_name == 'release' }}
        # GitHub allows at most 2 GiB per release file: bigger ISOs are split.
        # Reassemble: cat valolinux-*.iso.part-* > valolinux-<tag>-amd64.iso
        run: |
          cd out
          iso=$(ls valolinux-*.iso)
          if [ "$(stat -c %s "$iso")" -ge 2000000000 ]; then
            split -b 1900M -d "$iso" "$iso.part-"
            rm "$iso"
          fi
          gh release upload "$TAG" * --clobber --repo "$GITHUB_REPOSITORY"

  server-image:
    needs: test
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/valolinux-server" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest

  agent:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-24.04
    # built on Debian trixie so the binary matches the image's glibc
    container: debian:trixie
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Install tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential git gh
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - uses: actions/checkout@v4
      - name: Build
        run: |
          . "$HOME/.cargo/env"
          cargo build --release --locked -p valo-agent
          mkdir -p out
          cp target/release/valo-agent "out/valo-agent-$TAG-linux-amd64"
          cd out && sha256sum valo-agent-* > SHA256SUMS-agent
      - uses: actions/upload-artifact@v4
        with:
          name: valo-agent
          path: out/*
      - name: Attach to release
        if: ${{ github.event_name == 'release' }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" out/* --clobber --repo "$GITHUB_REPOSITORY"
