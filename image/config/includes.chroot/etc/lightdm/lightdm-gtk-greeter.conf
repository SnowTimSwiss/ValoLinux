[greeter]
background=/usr/share/backgrounds/valolinux-greeter.png
user-background=false
theme-name=ValoLinux
icon-theme-name=Adwaita
font-name=Inter 11
default-user-image=/usr/share/pixmaps/valolinux-logo.png
indicators=~host;~spacer;~clock;~spacer;~session;~power
clock-format=%A, %d. %B  %H:%M
position=50%,center 55%,center
round-user-image=false
