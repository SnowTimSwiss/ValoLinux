# ValoLinux boot menu (UEFI/GRUB). Placeholders (@...@) are filled in by live-build
# (scripts/build/binary_grub_cfg). Replaces the generated "Live system" entries.
source /boot/grub/config.cfg

menuentry "ValoLinux starten" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "ValoLinux starten (abgesicherter Modus)" --hotkey=a {
	linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@
	initrd	@INITRD_LIVE@
}

if @ENABLE_INSTALL_MENU@; then
menuentry "ValoLinux auf diesem Gerät installieren" --hotkey=i {
	linux	@KERNEL_GI@ vga=788 @APPEND_INSTALL@ --- quiet
	initrd	@INITRD_GI@
}

submenu 'Weitere Installationsoptionen …' --hotkey=w {
	source /boot/grub/theme.cfg
	source /boot/grub/install.cfg
}
fi

submenu 'Werkzeuge …' --hotkey=t {
	source /boot/grub/theme.cfg

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI-Einstellungen (Firmware)" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Startmedium auf Fehler prüfen" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}

menuentry "Neu starten" --hotkey=r {
	reboot
}

menuentry "Ausschalten" --hotkey=h {
	halt
}
